AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  AMI:
    Default: /aws/service/ami-windows-latest/Windows_Server-2025-English-Full-Base
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Configuration
        Parameters:
          - AMI
    ParameterLabels:
      AMI:
        default: SSM Parameter Value for Latest AMI ID
Resources:
  VPC:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W60
            reason: This is for an Immersion Day only, flow logs not needed
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/24
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub AMD-on-AWS-VPC-${AWS::StackName}
  VPCPublicSubnet1Subnet:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W33
            reason: This is for an Immersion Day only, MapPublicIpOnLaunch is ok and may be needed to access instances
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select
        - 0
        - Fn::GetAZs: !Ref AWS::Region
      CidrBlock: !Select
        - 0
        - Fn::Cidr:
            - !GetAtt VPC.CidrBlock
            - 2
            - 6
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub AMD-on-AWS-Subnet1-${AWS::StackName}
      VpcId: !Ref VPC
  VPCPublicSubnet1RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      Tags:
        - Key: Name
          Value: !Sub AMD-on-AWS-Subnet1-${AWS::StackName}
      VpcId: !Ref VPC
  VPCPublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: VPCPublicSubnet1RouteTable
      SubnetId:
        Ref: VPCPublicSubnet1Subnet
  VPCPublicSubnet1DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCVPCGW
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: VPCIGW
      RouteTableId:
        Ref: VPCPublicSubnet1RouteTable
  VPCPublicSubnet2Subnet:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W33
            reason: This is for an Immersion Day only, MapPublicIpOnLaunch is ok and may be needed to access instances
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select
        - 1
        - Fn::GetAZs: !Ref AWS::Region
      CidrBlock: !Select
        - 1
        - Fn::Cidr:
            - !GetAtt VPC.CidrBlock
            - 2
            - 6
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub AMD-on-AWS-Subnet2-${AWS::StackName}
      VpcId: !Ref VPC
  VPCPublicSubnet2RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      Tags:
        - Key: Name
          Value: !Sub AMD-on-AWS-Subnet2-${AWS::StackName}
      VpcId: !Ref VPC
  VPCPublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: VPCPublicSubnet2RouteTable
      SubnetId:
        Ref: VPCPublicSubnet2Subnet
  VPCPublicSubnet2DefaultRoute:
    DependsOn: VPCVPCGW
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: VPCIGW
      RouteTableId:
        Ref: VPCPublicSubnet2RouteTable
  VPCIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub AMD-on-AWS-VPC-IGW-${AWS::StackName}
  VPCVPCGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId:
        Ref: VPCIGW
      VpcId: !Ref VPC
  InstanceRole:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: This is for an Immersion Day only, * resource on its permissions policy ok
          - id: W28
            reason: This is for an Immersion Day only, explicit names are ok
          - id: W76
            reason: This is for an Immersion Day only, SPCM for IAM policy document is higher than 25 ok
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
        Version: "2012-10-17"
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !Sub arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy
      Path: /
      Policies:
        - PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action: cloudformation:SignalResource
                Effect: Allow
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
              - Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Effect: Allow
                Resource:
                  - !Ref AdminSecret
              - Action: ssm:SendCommand
                Effect: Allow
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:*:document/AWS-RunRemoteScript
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:*:document/AWS-RunPowerShellScript
              - Action: ssm:SendCommand
                Condition:
                  StringEquals:
                    ssm:ResourceTag/aws:cloudformation:stack-name:
                      Ref: AWS::StackName
                Effect: Allow
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
              - Action:
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:CreateNetworkInterface
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteNetworkInterface
                  - ec2:DeleteSecurityGroup
                  - ec2:DescribeInstances
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:DescribeSecurityGroups
                  - logs:CreateLogGroup
                  - logs:GetLogEvents
                  - logs:PutResourcePolicy
                  - ssm:DescribeInstanceInformation
                  - ssm:ListCommands
                  - ssm:ListCommandInvocations
                  - ssm:StartAutomationExecution
                  - sts:GetCallerIdentity
                Effect: Allow
                Resource: "*"
          PolicyName: Inline-Policy
      RoleName: !Sub AMD-on-AWS-InstanceRole-${AWS::StackName}
      Tags:
        - Key: StackName
          Value:
            Ref: AWS::StackName
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub AMD-on-AWS-InstanceRole-${AWS::StackName}
      Path: /
      Roles:
        - Ref: InstanceRole
  AdminSecret:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W77
            reason: This is for an Immersion Day only, not using explicitly specify KmsKeyId ok
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub AMD-on-AWS-AdminSecret-${AWS::StackName}
      Description: Admin Password for local machine
      GenerateSecretString:
        SecretStringTemplate: '{"username": "Admin"}'
        GenerateStringKey: 'password'
        PasswordLength: 30
        ExcludeCharacters: '"@/\'
  ServerSG:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: This is for an Immersion Day only, open to world on egress ok
          - id: W27
            reason: This is for an Immersion Day only, ingress with port range instead of just a single port ok
          - id: W28
            reason: This is for an Immersion Day only, explicit names are ok
          - id: W40
            reason: This is for an Immersion Day only, egress with an IpProtocol of -1 ok
          - id: W42
            reason: This is for an Immersion Day only, ingress with an ipProtocol of -1 ok
    Properties:
      GroupDescription: Server Security Group
      GroupName: !Sub AMD-on-AWS-Server-SG-${AWS::StackName}
      SecurityGroupEgress:
        - Description: All Outbound Traffic
          FromPort: -1
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          ToPort: -1
      SecurityGroupIngress:
        - Description: All Local VPC Traffic
          FromPort: -1
          IpProtocol: "-1"
          CidrIp: !GetAtt VPC.CidrBlock
          ToPort: -1
      Tags:
        - Key: Name
          Value: !Sub AMD-on-AWS-Server-SG-${AWS::StackName}
      VpcId: !Ref VPC
  InstanceSSMAuto:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Automation
      DocumentFormat: YAML
      Name: !Sub InstanceSetup-${AWS::StackName}
      Content:
        schemaVersion: '0.3'
        description: Deploy MGMT Instance with SSM Automation
        parameters:
          AdminSecret:
            description: AWS Secrets Parameter Name for the MAD Admin account.
            type: String
          ServerNetBIOSName:
            description: NetBIOS name of the Management Instance server (up to 15 characters)
            type: String
          StackName:
            description: Stack Name Input for cfn resource signal
            type: String
        mainSteps:
          - name: InstanceId
            action: aws:executeAwsApi
            onFailure: step:signalfailure
            inputs:
              Service: ec2
              Api: DescribeInstances
              Filters:
                - Name: tag:Name
                  Values: ['{{ServerNetBIOSName}}']
                - Name: tag:aws:cloudformation:stack-name
                  Values: ['{{StackName}}']
                - Name: instance-state-name
                  Values: ['running']
            outputs:
              - Name: InstanceId
                Selector: $.Reservations[0].Instances[0].InstanceId
                Type: String
            nextStep: intializeInstance
          - name: intializeInstance
            action: aws:runCommand
            onFailure: step:signalfailure
            inputs:
              DocumentName: AWS-RunPowerShellScript
              InstanceIds:
                - '{{InstanceId.InstanceId}}'
              Parameters:
                commands: |-
                  If ($env:COMPUTERNAME -ne '{{ServerNetBIOSName}}') {
                      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

                      $RegistryItems = @(
                          @{
                              Name         = 'SchUseStrongCrypto'
                              Path         = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\.NETFramework\v4.0.30319'
                              Value        = '1'
                              PropertyType = 'DWORD'
                          },
                          @{
                              Name         = 'SchUseStrongCrypto'
                              Path         = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Wow6432Node\Microsoft\.NETFramework\v4.0.30319'
                              Value        = '1'
                              PropertyType = 'DWORD'
                          },
                          @{
                              Name         = 'HideFirstRunExperience'
                              Path         = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge'
                              Value        = '1'
                              PropertyType = 'DWORD'
                          }
                      )

                      Function Get-SecretInfo {
                          [CmdletBinding()]
                          Param (
                              [Parameter(Mandatory = $True)][String]$SecretArn
                          )

                          Write-Output "Getting $SecretArn Secret"
                          Try {
                              $SecretContent = Get-SECSecretValue -SecretId $SecretArn -ErrorAction Stop | Select-Object -ExpandProperty 'SecretString' | ConvertFrom-Json -ErrorAction Stop
                          } Catch [System.Exception] {
                              Write-Output "Failed to get $SecretArn Secret $_"
                              Exit 1
                          }

                          Write-Output 'Creating PSCredential object from Secret'
                          $Username = $SecretContent.username
                          $UserPassword = ConvertTo-SecureString ($SecretContent.password) -AsPlainText -Force
                          $Credentials = New-Object -TypeName 'System.Management.Automation.PSCredential' ($Username, $UserPassword)

                          $Output = [PSCustomObject][Ordered]@{
                              'Credentials'       = $Credentials
                              'Username'          = $Username
                              'UserPassword'      = $UserPassword
                          }

                          Return $Output
                      }

                      $AdminPW = Get-SecretInfo -SecretArn '{{AdminSecret}}'
                      Try {
                          Set-LocalUser -Name "Administrator" -Password $AdminPW.UserPassword
                      } Catch [System.Exception] {
                          Write-Output "Failed to set local admin password $_"
                          Exit 1
                      }

                      Try {
                          Rename-Computer -NewName '{{ServerNetBIOSName}}' -Force
                      } Catch [System.Exception] {
                          Write-Output "Failed to rename computer $_"
                          Exit 1
                      }

                      Foreach ($RegistryItem in $RegistryItems) {
                          $KeyPresent = Test-Path -Path $RegistryItem.Path -ErrorAction SilentlyContinue
                          If (-not $KeyPresent) {
                              Try {
                                  $Null = New-Item -Path $RegistryItem.Path -Force -ErrorAction Stop
                              } Catch [System.Exception] {
                                  Write-Output "Failed to create Registry named $($RegistryItem.Path) $_"
                                  Exit 1
                              }
                          }
                          Try {
                              $Null = New-ItemProperty @RegistryItem -Force -ErrorAction Stop
                          } Catch [System.Exception] {
                              Write-Output "Failed to create Registry key named $($RegistryItem.Name) at $($RegistryItem.Path) $_"
                              Exit 1
                          }
                      }
                      Exit 3010
                  } Else {
                      Write-Output 'Server setup complete'
                  }
              CloudWatchOutputConfig:
                CloudWatchOutputEnabled: true
                CloudWatchLogGroupName: !Sub /aws/AMD-ID/${AWS::StackName}
          - name: CFNSignalEnd
            action: aws:branch
            inputs:
              Choices:
                - NextStep: signalsuccess
                  Not:
                    Variable: '{{StackName}}'
                    StringEquals: ''
                - NextStep: sleepend
                  Variable: '{{StackName}}'
                  StringEquals: ''
          - name: signalsuccess
            action: aws:executeAwsApi
            isEnd: True
            inputs:
              Service: cloudformation
              Api: SignalResource
              LogicalResourceId: Instance
              StackName: '{{StackName}}'
              Status: SUCCESS
              UniqueId: '{{InstanceId.InstanceId}}'
          - name: sleepend
            action: aws:sleep
            isEnd: True
            inputs:
              Duration: PT1S
          - name: signalfailure
            action: aws:executeAwsApi
            inputs:
              Service: cloudformation
              Api: SignalResource
              LogicalResourceId: Instance
              StackName: '{{StackName}}'
              Status: FAILURE
              UniqueId: '{{InstanceId.InstanceId}}'
      Tags:
        - Key: StackName
          Value: !Ref AWS::StackName
  Instance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT30M
        Count: 1
    Properties:
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 45
            VolumeType: gp3
            Encrypted: true
            KmsKeyId: alias/aws/ebs
            DeleteOnTermination: true
      IamInstanceProfile: !Ref InstanceProfile
      ImageId: !Ref AMI
      InstanceType: r5.4xlarge
      SecurityGroupIds:
        - !Ref ServerSG
      SubnetId: !Ref VPCPublicSubnet1Subnet
      Tags:
        - Key: Name
          Value: AMD-ID-01
      UserData:
        Fn::Base64: !Sub |
            - |
              <powershell>
              $Params = @{
                  AdminSecret          = '${AdminSecret}'
                  ServerNetBIOSName    = 'AMD-ID-01'
                  StackName            = '${AWS::StackName}'
              }
              Start-SSMAutomationExecution -DocumentName '${InstanceSSMAuto}' -Parameter $Params
              </powershell>
  PrimeNumberTestSSMAuto:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Automation
      DocumentFormat: YAML
      Name: !Sub PrimeNumberTest-${AWS::StackName}
      Content:
        description: Creates Prime Number Test.
        schemaVersion: '0.3'
        parameters:
          AmiName:
            default: /aws/service/ami-windows-latest/Windows_Server-2025-English-Full-Base
            description: Image Name to launch EC2 instance
            type: String
            allowedValues:
              - /aws/service/ami-windows-latest/Windows_Server-2025-English-Full-Base
              - /aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base
              - /aws/service/ami-windows-latest/Windows_Server-2019-English-Full-Base
          AutomationAssumeRole:
            default: ''
            description: (Optional) The ARN of the role that allows Automation to perform the actions on your behalf. If no role is specified, Systems Manager Automation uses your IAM permissions to run this runbook.
            type: String
          AvailiblityZone:
            default: us-west-2a
            description: The AZ ID or the Local Zone ID for a subnet.
            type: String
          InstanceType1:
            default: r5.4xlarge
            description: Instance type of the Instance
            type: String
          InstanceType2:
            default: r8a.4xlarge
            description: Instance type of the Instance
            type: String
          CoreCount:
            default: 6
            description: The number of cores enabled on an optimized EC2 instance
            type: Integer
          ThreadsPerCore:
            default: 1
            description: The number of threads enabled on an optimized EC2 instance (for 7a and 8a this must be set to 1)
            type: Integer
          PrimeNumberTestRunLimit:
            default: '10'
            description: The number of times the test will run in a loop
            type: String
          PrimeNumberTestUpperNumberRange:
            default: '10000'
            description: The upper number of the range to find prime numbers in (larger the number the longer it takes to process)
            type: String
        mainSteps:
          - name: createVpc
            action: aws:executeAwsApi
            nextStep: configureVpcDnsHost
            isEnd: false
            onFailure: Abort
            inputs:
              Service: ec2
              Api: CreateVpc
              CidrBlock: 10.0.0.0/24
              TagSpecifications:
                - ResourceType: vpc
                  Tags:
                    - Key: Name
                      Value: PrimeNumberTest-{{automation:EXECUTION_ID}}
            outputs:
              - Name: vpcId
                Selector: $.Vpc.VpcId
                Type: String
          - name: configureVpcDnsHost
            action: aws:executeAwsApi
            nextStep: configureVpcDns
            isEnd: false
            onFailure: Abort
            inputs:
              Service: ec2
              Api: ModifyVpcAttribute
              EnableDnsHostnames:
                Value: true
              VpcId: '{{createVpc.vpcId}}'
          - name: configureVpcDns
            action: aws:executeAwsApi
            nextStep: createRouteTable
            isEnd: false
            onFailure: Abort
            inputs:
              Service: ec2
              Api: ModifyVpcAttribute
              EnableDnsSupport:
                Value: true
              VpcId: '{{createVpc.vpcId}}'
          - name: createRouteTable
            action: aws:executeAwsApi
            nextStep: createInternetGateway
            isEnd: false
            onFailure: Abort
            inputs:
              Service: ec2
              Api: CreateRouteTable
              VpcId: '{{createVpc.vpcId}}'
              TagSpecifications:
                - ResourceType: route-table
                  Tags:
                    - Key: Name
                      Value: PrimeNumberTest-{{automation:EXECUTION_ID}}
            outputs:
              - Name: routeTableId
                Selector: $.RouteTable.RouteTableId
                Type: String
          - name: createInternetGateway
            action: aws:executeAwsApi
            nextStep: attachInternetGateway
            isEnd: false
            onFailure: Abort
            inputs:
              Service: ec2
              Api: CreateInternetGateway
              TagSpecifications:
                - ResourceType: internet-gateway
                  Tags:
                    - Key: Name
                      Value: PrimeNumberTest-{{automation:EXECUTION_ID}}
            outputs:
              - Name: internetGatewayId
                Selector: $.InternetGateway.InternetGatewayId
                Type: String
          - name: attachInternetGateway
            action: aws:executeAwsApi
            nextStep: createRoute
            isEnd: false
            onFailure: Abort
            inputs:
              Service: ec2
              Api: AttachInternetGateway
              InternetGatewayId: '{{createInternetGateway.internetGatewayId}}'
              VpcId: '{{createVpc.vpcId}}'
          - name: createRoute
            action: aws:executeAwsApi
            nextStep: createSubnet
            isEnd: false
            onFailure: Abort
            inputs:
              Service: ec2
              Api: CreateRoute
              DestinationCidrBlock: 0.0.0.0/0
              GatewayId: '{{createInternetGateway.internetGatewayId}}'
              RouteTableId: '{{createRouteTable.routeTableId}}'
          - name: createSubnet
            action: aws:executeAwsApi
            nextStep: configureModifySubnetAttribute
            isEnd: false
            onFailure: Abort
            inputs:
              Service: ec2
              Api: CreateSubnet
              CidrBlock: 10.0.0.0/27
              AvailabilityZone: '{{AvailiblityZone}}'
              VpcId: '{{createVpc.vpcId}}'
              TagSpecifications:
                - ResourceType: subnet
                  Tags:
                    - Key: Name
                      Value: PrimeNumberTest-{{automation:EXECUTION_ID}}
            outputs:
              - Name: subnetId
                Selector: $.Subnet.SubnetId
                Type: String
          - name: configureModifySubnetAttribute
            action: aws:executeAwsApi
            nextStep: associateRouteTable
            isEnd: false
            onFailure: Abort
            inputs:
              Service: ec2
              Api: ModifySubnetAttribute
              MapPublicIpOnLaunch:
                Value: true
              SubnetId: '{{createSubnet.subnetId}}'
          - name: associateRouteTable
            action: aws:executeAwsApi
            nextStep: getAmiId
            isEnd: false
            onFailure: Abort
            inputs:
              Service: ec2
              Api: AssociateRouteTable
              RouteTableId: '{{createRouteTable.routeTableId}}'
              SubnetId: '{{createSubnet.subnetId}}'
            outputs:
              - Name: associationId
                Selector: $.AssociationId
                Type: String
          - name: getAmiId
            action: aws:executeAwsApi
            nextStep: createInstanceRole
            isEnd: false
            onFailure: Abort
            inputs:
              Service: ssm
              Api: GetParameter
              Name: '{{AmiName}}'
            outputs:
              - Name: amiId
                Selector: $.Parameter.Value
                Type: String
          - name: createInstanceRole
            action: aws:executeAwsApi
            nextStep: attachManagedSSMPolicy
            isEnd: false
            onFailure: Abort
            inputs:
              Service: iam
              Api: CreateRole
              AssumeRolePolicyDocument: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":["ec2.amazonaws.com"]},"Action":["sts:AssumeRole"]}]}'
              RoleName: PrimeNumberTest-{{automation:EXECUTION_ID}}
            outputs:
              - Name: instanceRoleName
                Selector: $.Role.RoleName
                Type: String
          - name: attachManagedSSMPolicy
            action: aws:executeAwsApi
            nextStep: attachManagedCWPolicy
            isEnd: false
            onFailure: Abort
            inputs:
              Service: iam
              Api: AttachRolePolicy
              PolicyArn: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
              RoleName: '{{createInstanceRole.instanceRoleName}}'
          - name: attachManagedCWPolicy
            action: aws:executeAwsApi
            nextStep: putRolePolicy
            isEnd: false
            onFailure: Abort
            inputs:
              Service: iam
              Api: AttachRolePolicy
              PolicyArn: arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
              RoleName: '{{createInstanceRole.instanceRoleName}}'
          - name: putRolePolicy
            action: aws:executeAwsApi
            nextStep: createInstanceProfile
            onFailure: Abort
            inputs:
              Service: iam
              Api: PutRolePolicy
              PolicyDocument: >-
                {
                    "Version": "2012-10-17",
                    "Statement": [
                        {
                            "Effect": "Allow",
                            "Resource": [ "*" ],
                            "Action": [
                                "ec2:DescribeInstanceTypes",
                                "ec2:DescribeInstanceTypeOfferings"
                            ]
                        }
                    ]
                }
              PolicyName: PrimeNumberTest-{{automation:EXECUTION_ID}}
              RoleName: PrimeNumberTest-{{automation:EXECUTION_ID}}
          - name: createInstanceProfile
            action: aws:executeAwsApi
            nextStep: addInstanceRoleToProfile
            isEnd: false
            onFailure: Abort
            inputs:
              Service: iam
              Api: CreateInstanceProfile
              InstanceProfileName: PrimeNumberTest-{{automation:EXECUTION_ID}}
            outputs:
              - Name: instanceProfileArn
                Selector: $.InstanceProfile.Arn
                Type: String
              - Name: instanceProfileName
                Selector: $.InstanceProfile.InstanceProfileName
                Type: String
          - name: addInstanceRoleToProfile
            action: aws:executeAwsApi
            nextStep: createPrimeNumberTestSecGroup
            isEnd: false
            onFailure: Abort
            inputs:
              Service: iam
              Api: AddRoleToInstanceProfile
              InstanceProfileName: '{{createInstanceProfile.instanceProfileName}}'
              RoleName: '{{createInstanceRole.instanceRoleName}}'
          - name: createPrimeNumberTestSecGroup
            action: aws:executeAwsApi
            nextStep: waitForIam
            isEnd: false
            onFailure: Abort
            inputs:
              Service: ec2
              Api: CreateSecurityGroup
              GroupName: PrimeNumberTestSecGroup-{{automation:EXECUTION_ID}}
              Description: Security Group for Prime Number Test
              VpcId: '{{createVpc.vpcId}}'
            outputs:
              - Name: primeNumberTestGroupId
                Selector: $.GroupId
                Type: String
          - name: waitForIam
            action: aws:sleep
            nextStep: launchInstance1
            isEnd: false
            inputs:
              Duration: PT20S
          - name: launchInstance1
            action: aws:executeAwsApi
            nextStep: launchInstance2
            isEnd: false
            onFailure: Abort
            inputs:
              Service: ec2
              Api: RunInstances
              BlockDeviceMappings:
                - DeviceName: /dev/sda1
