  S3Bucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName:
        !Sub
          - 'amd-on-aws-hands-on-lab-${RandomGUID}'
          - { RandomGUID: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId ]]]] }
      VersioningConfiguration:
        Status: Enabled
  DataExportBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAWSDataExportsToWriteToS3AndCheckPolicy
            Effect: Allow
            Principal:
              Service:
                - billingreports.amazonaws.com
                - bcm-data-exports.amazonaws.com
            Action:
              - 's3:PutObject'
              - 's3:GetBucketPolicy'
            Resource:
              - !Sub 'arn:aws:s3:::${S3Bucket}'
              - !Sub 'arn:aws:s3:::${S3Bucket}/*'
            Condition:
              StringLike:
                'aws:SourceArn':
                  - 'arn:aws:cur:us-east-1:${AWS::AccountId}:definition/*'
                  - 'arn:aws:bcm-data-exports:us-east-1:${AWS::AccountId}:export/*'
                'aws:SourceAccount': '${AWS::AccountId}'
  RdsRole:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: This is for an Immersion Day only, explicit names are ok
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - rds.amazonaws.com
        Version: "2012-10-17"
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonRDSDirectoryServiceAccess
      Path: /
      RoleName: !Sub AMD-on-AWS-RdsRole-${AWS::StackName}
      Tags:
        - Key: StackName
          Value:
            Ref: AWS::StackName
  RdsAdminSecret:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W77
            reason: This is for an Immersion Day only, not using explicitly specify KmsKeyId ok
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
    
      Name: !Sub AMD-on-AWS-RdsAdminSecret-${AWS::StackName}
      Description: SQL Password for Amazon RDS 
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: 'password'
        PasswordLength: 30
        ExcludeCharacters: '"@/\'
  RdsDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub AMD-on-AWS-DBSubnetGroup-${AWS::StackName}
      DBSubnetGroupName: !Sub AMD-on-AWS-DBSubnetGroup-${AWS::StackName}
      SubnetIds:
        - !Ref VPCPublicSubnet1Subnet
        - !Ref VPCPublicSubnet2Subnet
  RdsSG:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: This is for an Immersion Day only, open to world on egress ok
          - id: W28
            reason: This is for an Immersion Day only, explicit names are ok
          - id: W40
            reason: This is for an Immersion Day only, egress with an IpProtocol of -1 ok
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS Security Group
      GroupName: !Sub AMD-on-AWS-DBSecurityGroup-${AWS::StackName}
      SecurityGroupEgress:
        - Description: All Outbound Traffic
          FromPort: -1
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          ToPort: -1
      SecurityGroupIngress:
        - Description: SQL Access
          FromPort: 1433
          IpProtocol: tcp
          CidrIp: !GetAtt VPC.CidrBlock
          ToPort: 1433
      Tags:
        - Key: Name
          Value: !Sub AMD-on-AWS-DBSecurityGroup-${AWS::StackName}
      VpcId: !Ref VPC
  RdsDB:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: F24
            reason: This is for an Immersion Day only, RDS instance master username is ok for plaintext
          - id: F80
            reason: This is for an Immersion Day only, deletion protection not needed
          - id: W28
            reason: This is for an Immersion Day only, explicit names are ok
          - id: W75
            reason: This is for an Immersion Day only, backup retention period greater than 0 not needed
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AllocatedStorage: 20
      AvailabilityZone: !Select
        - 0
        - Fn::GetAZs: !Ref AWS::Region
      BackupRetentionPeriod: 0
      DBInstanceClass: db.r5.4xlarge
      DBInstanceIdentifier: AMD-ID-01
      DBSubnetGroupName: !Ref RdsDBSubnetGroup
      DeleteAutomatedBackups: true
      Engine: sqlserver-se
      EngineVersion: 15.00.4198.2.v1
      KmsKeyId: alias/aws/rds
      LicenseModel: license-included
      MasterUsername: admin
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${RdsAdminSecret}:SecretString:password}}'
      MultiAZ: false
      PubliclyAccessible: false
      StorageEncrypted: true
      StorageType: gp3
      VPCSecurityGroups:
        - !Ref RdsSG
